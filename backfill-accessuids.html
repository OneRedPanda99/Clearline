<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clearline — Backfill job accessUids</title>
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="tailwind.css?v=2">
</head>
<body class="bg-gray-900 text-gray-100 p-6">
  <div class="max-w-2xl mx-auto space-y-4">
    <h1 class="text-xl font-bold">Backfill job <code>accessUids</code></h1>
    <p class="text-sm text-gray-400">
      Signs you in directly (no dependency on the app), then stamps
      <code>accessUids</code> on every existing job so the new Firestore
      <code>list</code> rule works. Safe to run more than once.
    </p>

    <div id="login" class="space-y-2">
      <button id="google" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded text-sm w-full">Sign in with Google</button>
      <div class="text-center text-xs text-gray-500">— or —</div>
      <label for="email" class="sr-only">Email</label>
      <input id="email" name="email" placeholder="email" class="w-full bg-gray-800 rounded px-3 py-2 text-sm" value="parkerbranham@gmail.com" />
      <label for="pass" class="sr-only">Password</label>
      <input id="pass" name="pass" type="password" placeholder="password" class="w-full bg-gray-800 rounded px-3 py-2 text-sm" />
      <button id="signin" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm w-full">Sign in with email</button>
      <div id="loginErr" class="text-red-400 text-xs"></div>
    </div>

    <button id="run" class="hidden bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded disabled:opacity-50"
            onclick="runBackfill()">Backfill all jobs</button>
    <button id="diag" class="hidden bg-yellow-600 hover:bg-yellow-500 text-white px-4 py-2 rounded"
            onclick="runDiagnose()">Diagnose (dump assignments)</button>
    <button id="mgr" class="hidden bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded"
            onclick="makeMeManager()">Make me manager of all workers</button>
    <button id="assignx" class="hidden bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded"
            onclick="assignCrewToJob()">Add me + Xavier as crew to a job</button>
    <button id="testme" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded"
            onclick="testMyAccess()">Test MY job access (runs worker query)</button>
    <div id="inspectRow" class="hidden flex items-center gap-2 flex-wrap">
      <input id="inspectJobId" placeholder="job id" value="job_1779736056978_hx2eix7"
             class="px-2 py-1 rounded text-black text-sm" style="width:260px;">
      <button id="inspect" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded"
              onclick="inspectJob(document.getElementById('inspectJobId').value)">Inspect job accessUids</button>
    </div>

    <pre id="log" class="bg-black/40 rounded p-3 text-xs whitespace-pre-wrap h-64 overflow-auto"></pre>
  </div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }

    firebase.initializeApp(window.CL_SECRETS.firebase);
    const auth = firebase.auth();
    const db = firebase.firestore();

    document.getElementById('google').addEventListener('click', async () => {
      document.getElementById('loginErr').textContent = '';
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/calendar.events');
        await auth.signInWithPopup(provider);
      } catch (e) {
        document.getElementById('loginErr').textContent = e.message;
      }
    });

    document.getElementById('signin').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      document.getElementById('loginErr').textContent = '';
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (e) {
        document.getElementById('loginErr').textContent = e.message;
      }
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('run').classList.remove('hidden');
        document.getElementById('diag').classList.remove('hidden');
        document.getElementById('mgr').classList.remove('hidden');
        document.getElementById('assignx').classList.remove('hidden');
        document.getElementById('testme').classList.remove('hidden');
        document.getElementById('inspect').classList.remove('hidden');
        document.getElementById('inspectRow').classList.remove('hidden');
        log('Signed in as ' + user.email + ' (uid ' + user.uid + ')');
      }
    });

    // Owner acts as manager: set assignedManager = my uid on every worker doc.
    // This only writes the `assignedManager` field, which the users update
    // rule permits the owner to change on any user. Workers then show your
    // name instead of "Unassigned" in the Manager Panel.
    async function makeMeManager() {
      const me = auth.currentUser;
      if (!me) { log('Not signed in.'); return; }
      const snap = await db.collection('users').get();
      const workers = snap.docs.filter(d => (d.data().role || 'worker') === 'worker');
      log('Found ' + workers.length + ' worker(s). Setting assignedManager=' + me.uid + ' ...');
      let updated = 0, skipped = 0, failed = 0;
      for (const doc of workers) {
        const d = doc.data();
        if (d.assignedManager === me.uid) { skipped++; continue; }
        try {
          await doc.ref.update({ assignedManager: me.uid });
          updated++;
          log('  updated ' + (d.username || d.displayName || doc.id));
        } catch (e) {
          failed++;
          log('  FAILED ' + doc.id + ': ' + e.message);
        }
      }
      log('Done. updated=' + updated + ' skipped=' + skipped + ' failed=' + failed);
    }

    // Add the OWNER (you) + Xavier as crew to ONE job. Does not touch
    // other jobs or managers. Finds Xavier by username/displayName.
    async function assignCrewToJob() {
      const me = auth.currentUser;
      if (!me) { log('Not signed in.'); return; }
      const ownerUid = (window.CL_SECRETS && window.CL_SECRETS.ownerUid) || me.uid;

      // Resolve Xavier's uid from the users collection.
      const users = await db.collection('users').get();
      let xavierUid = null;
      for (const d of users.docs) {
        const u = d.data();
        if ((u.username || '').toLowerCase() === 'xavierf'
          || (u.displayName || '').toLowerCase() === 'xavier ferrand') { xavierUid = d.id; break; }
      }
      if (!xavierUid) { log('Could not find XavierF user.'); return; }
      log('Xavier uid=' + xavierUid);

      // List jobs so you can pick one by id or customer name.
      const snap = await db.collection('jobs').get();
      log('Jobs (id — customer):');
      snap.forEach(d => log('  ' + d.id + ' — ' + (d.data().customerName || d.data().customer || '(no name)')));

      const target = (prompt('Paste the job id (or customer name) to add crew to:') || '').trim();
      if (!target) { log('Cancelled.'); return; }
      let doc = snap.docs.find(d => d.id === target)
        || snap.docs.find(d => (d.data().customerName || d.data().customer || '').toLowerCase() === target.toLowerCase());
      if (!doc) { log('No job matched "' + target + '".'); return; }

      const d = doc.data();
      const workers = Array.isArray(d.assignedWorkers) ? d.assignedWorkers.slice() : [];
      if (!workers.includes(ownerUid)) workers.push(ownerUid);
      if (!workers.includes(xavierUid)) workers.push(xavierUid);
      const out = {
        assignedWorkers: workers,
        accessUids: window.buildAccessUids(
          { assignedWorkers: workers, assignedManager: d.assignedManager, assignedTo: d.assignedTo, createdBy: d.createdBy },
          d
        )
      };
      try {
        await doc.ref.update(out);
        log('Updated ' + doc.id + ' crew=[' + workers.join(', ') + ']');
      } catch (e) {
        log('FAILED ' + doc.id + ': ' + e.message);
      }
    }

    async function inspectJob(jobId) {
      jobId = (jobId || '').trim();
      if (!jobId) { log('Enter a job id first.'); return; }
      const me = auth.currentUser;
      if (!me) { log('Not signed in.'); return; }
      try {
        const d = await db.collection('jobs').doc(jobId).get();
        if (!d.exists) { log('Job ' + jobId + ' does not exist.'); return; }
        const data = d.data();
        log('--- ' + jobId + ' (live) ---');
        log('assignedWorkers = ' + JSON.stringify(data.assignedWorkers || []));
        log('assignedManager = ' + (data.assignedManager || ''));
        log('createdBy       = ' + (data.createdBy || ''));
        log('accessUids      = ' + JSON.stringify(data.accessUids || []));
        const x = '2QGDGaBmr9f6ITcVjs5q2Shopnf2';
        const inAW = Array.isArray(data.accessUids) && data.accessUids.includes(x);
        log('Xavier (' + x + ') in accessUids? ' + (inAW ? 'YES' : 'NO  <-- THIS IS WHY HE IS DENIED'));
      } catch (e) {
        log('READ DENIED: ' + (e.code || e.message));
      }
    }

    // Kiefer's job id (from earlier diagnostics).
    const KIEFER_JOB = 'job_1779736056978_hx2eix7';

    async function testMyAccess() {
      const me = auth.currentUser;
      if (!me) { log('Not signed in.'); return; }
      const uid = me.uid;
      log('Testing as ' + me.email + ' (uid ' + uid + ')');
      log('Running: jobs where accessUids array-contains ' + uid);
      try {
        const snap = await db.collection('jobs').where('accessUids', 'array-contains', uid).get();
        log('RESULT: ' + snap.size + ' job(s) returned.');
        snap.forEach(d => log('  -> ' + d.id + ' (' + (d.data().customerName || d.data().customer || '?') + ')'));
        if (snap.size === 0) log('Empty. Either rules deny it, or no job has your uid in accessUids.');
      } catch (e) {
        log('QUERY DENIED: ' + (e.code || e.message));
      }
    }

    async function runDiagnose() {
      const me = auth.currentUser;
      if (!me) { log('Not signed in.'); return; }
      const snap = await db.collection('jobs').where('accessUids', 'array-contains', me.uid).get();
      log('--- ' + snap.size + ' jobs: raw assignment fields + accessUids ---');
      for (const doc of snap.docs) {
        const d = doc.data();
        const aw = Array.isArray(d.assignedWorkers) ? d.assignedWorkers : (d.assignedTo ? [d.assignedTo] : []);
        log(doc.id + '\n  createdBy=' + d.createdBy + '\n  assignedManager=' + d.assignedManager
          + '\n  assignedWorkers=' + JSON.stringify(aw) + '\n  accessUids=' + JSON.stringify(d.accessUids || []));
      }
      log('--- end ---');
    }

    async function runBackfill() {
      const me = auth.currentUser;
      if (!me) { log('Not signed in.'); return; }
      const ownerUid = (window.CL_SECRETS && window.CL_SECRETS.ownerUid) || me.uid;
      log('Owner uid used: ' + ownerUid);

      const snap = await db.collection('jobs').where('accessUids', 'array-contains', me.uid).get();
      log('Found ' + snap.size + ' jobs.');
      let updated = 0, skipped = 0, failed = 0;
      for (const doc of snap.docs) {
        const d = doc.data();
        const arr = window.buildAccessUids(d, d);
        const existing = Array.isArray(d.accessUids) ? d.accessUids : [];
        const same = existing.length === arr.length && existing.every((u, i) => u === arr[i]);
        if (same) { skipped++; continue; }
        try {
          await doc.ref.update({ accessUids: arr });
          updated++;
          log('  updated ' + doc.id);
        } catch (e) {
          failed++;
          log('  FAILED ' + doc.id + ': ' + e.message);
        }
      }
      log('\nDone. updated=' + updated + ' skipped=' + skipped + ' failed=' + failed);
    }
  </script>
</body>
</html>
