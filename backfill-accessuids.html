<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clearline — Backfill job accessUids</title>
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="firebase-sync.js?v=5"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-6">
  <div class="max-w-2xl mx-auto space-y-4">
    <h1 class="text-xl font-bold">Backfill job <code>accessUids</code></h1>
    <p class="text-sm text-gray-400">
      Signs you in with your normal Clearline account, then stamps
      <code>accessUids</code> on every existing job so the new Firestore
      <code>list</code> rule works. Safe to run more than once.
    </p>

    <div id="status" class="text-sm">Loading…</div>

    <button id="run" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded disabled:opacity-50"
            onclick="runBackfill()">Backfill all jobs</button>

    <pre id="log" class="bg-black/40 rounded p-3 text-xs whitespace-pre-wrap h-64 overflow-auto"></pre>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    function log(msg) {
      logEl.textContent += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function init() {
      try {
        await CL_FIREBASE.init();
      } catch (e) {
        statusEl.textContent = 'Firebase init failed: ' + e.message;
        return;
      }
      CL_FIREBASE.onAuth((user) => {
        if (user) {
          statusEl.textContent = 'Signed in as ' + user.email + ' (uid ' + user.uid + ')';
          document.getElementById('run').classList.remove('hidden');
        } else {
          statusEl.textContent = 'Sign in from the app first, then return to this page.';
        }
      });
      CL_FIREBASE.watchAuth();
    }

    async function runBackfill() {
      const db = CL_FIREBASE.getFirestore();
      const me = CL_FIREBASE.getCurrentUser();
      if (!me) { log('Not signed in.'); return; }
      const ownerUid = (window.CL_SECRETS && window.CL_SECRETS.ownerUid) || me.uid;
      log('Owner uid used for backfill: ' + ownerUid);

      const snap = await db.collection('jobs').get();
      log('Found ' + snap.size + ' jobs.');
      let updated = 0, skipped = 0, failed = 0;
      for (const doc of snap.docs) {
        const d = doc.data();
        const arr = window.buildAccessUids(d, d); // merges existing readers
        const existing = Array.isArray(d.accessUids) ? d.accessUids : [];
        const same = existing.length === arr.length
          && existing.every((u, i) => u === arr[i]);
        if (same) { skipped++; continue; }
        try {
          await doc.ref.update({ accessUids: arr });
          updated++;
          log('  updated ' + doc.id);
        } catch (e) {
          failed++;
          log('  FAILED ' + doc.id + ': ' + e.message);
        }
      }
      log('\nDone. updated=' + updated + ' skipped=' + skipped + ' failed=' + failed);
    }

    init();
  </script>
</body>
</html>
